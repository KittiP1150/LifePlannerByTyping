# todaylist_ws/docker-compose.yml
version: '3.8'

services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: intelliplan_db
    ports:
      - "3306:3306"
      
  backend-api:
    build: 
      context: ./plan-api-service
    ports:
      - "8000:8000"
    depends_on:
      - db
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
    ports:
      - "8080:80"

  frontend-web:
    build:
      context: ./plan-web-ui
    ports:
      - "3000:80"
    depends_on:
      - backend-api